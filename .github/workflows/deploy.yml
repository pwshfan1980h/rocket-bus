name: Deploy web build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  RELEASES: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot + web templates
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-web

      - name: Download Godot + web templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot/templates
          cd ~/godot
          curl -sSL -o godot.zip "$RELEASES/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot && rm godot.zip
          # The full template bundle is huge; keep only the web ones.
          curl -sSL -o templates.tpz "$RELEASES/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -j templates.tpz 'templates/web_nothreads_*' 'templates/version.txt' -d templates
          rm templates.tpz

      - name: Install templates
        run: |
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest" && cp ~/godot/templates/* "$dest/"

      - name: Export
        run: |
          mkdir -p build/web
          ~/godot/godot --headless --path . --import || true
          ~/godot/godot --headless --path . --export-release "Web" build/web/index.html
          test -f build/web/index.wasm

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
